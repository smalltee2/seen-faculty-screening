name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 03:00 Thailand time (20:00 UTC): refresh OpenAlex, Scopus and the admin form.
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch OpenAlex, Scopus and admin form (daily run only)
        if: github.event_name != 'push'
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
        run: npm run fetch
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openalex.tsv data/scopus.tsv data/manual.tsv data/tci_journals.csv data/tci_snapshots data/tci_tier_history.csv data/scopus_journals.csv data/conferences.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            # The iMac job or a manual push may have landed since checkout.
            git pull --rebase origin main
            git push
          fi
      - name: Build JSON from data/
        run: npm run data
      - name: Unit tests (rules engine and classifier)
        run: npm test
      - name: Build site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
