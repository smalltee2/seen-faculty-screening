name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 03:00 Thailand time (20:00 UTC): refresh OpenAlex, Scopus, TCI and both forms.
    - cron: '0 20 * * *'
    # Every hour at :15: the admin form, self-added works, button decisions and Crossref, so a
    # submission takes effect within about an hour (decided by Tum, 2026-11-06).
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch all sources (daily run and manual dispatch)
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 20 * * *'
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          DECISION_ADMINS: ${{ secrets.DECISION_ADMINS }}
        run: npm run fetch
      - name: Fetch the two Google Forms only (hourly run)
        if: github.event.schedule == '15 * * * *'
        env:
          DECISION_ADMINS: ${{ secrets.DECISION_ADMINS }}
        run: node scripts/fetch-sources.mjs --only=manual,decisions
      # Validate the fetched data before it is committed, so a bad fetch is not pushed.
      - name: Build JSON from data/
        run: npm run data
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openalex.tsv data/scopus.tsv data/manual.tsv data/self.tsv data/scholar_imports.tsv data/form_cancels.tsv data/crossref.tsv data/tci_journals.csv data/tci_snapshots data/tci_tier_history.csv data/scopus_journals.csv data/scopus_quartiles.csv data/conferences.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            # The iMac job or a manual push may have landed since checkout.
            git pull --rebase origin main
            git push
          fi
      - name: Build JSON again (the pull above may have brought newer data)
        if: github.event_name != 'push'
        run: npm run data
      - name: Unit tests (rules engine and classifier)
        run: npm test
      - name: Build site (and the personal pages when PERSONAL_SALT is set)
        env:
          PERSONAL_SALT: ${{ secrets.PERSONAL_SALT }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
