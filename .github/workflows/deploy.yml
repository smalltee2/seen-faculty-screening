name: Test, build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every day at 03:00 Thailand time (20:00 UTC): refresh OpenAlex, Scopus, TCI and both forms.
    - cron: '0 20 * * *'
    # Every hour at :15: the admin form, self-added works, button decisions and Crossref, so a
    # submission takes effect within about an hour (decided by Tum, 2026-11-06).
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/new-works.mjs reads the last 7 days of data commits to list the
          # works new in each source (the "ใหม่" badges on the admin page).
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # One run waits in the `pages` queue at a time, so a waiting daily run can be dropped when a newer
      # run arrives. The full fetch is therefore decided by the age of data/last_full_fetch.txt as well:
      # an hourly run does the full fetch when the last one is more than 25 hours old.
      - name: Decide which fetch this run does
        id: mode
        if: github.event_name != 'push'
        run: |
          mode=forms
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            mode=full
          else
            last=0
            # An empty or unreadable stamp counts as "never" (date -d "" would mean today).
            stamp=$(tr -d '[:space:]' < data/last_full_fetch.txt 2>/dev/null || true)
            if [ -n "$stamp" ]; then last=$(date -u -d "$stamp" +%s 2>/dev/null || echo 0); fi
            if [ $(( $(date -u +%s) - last )) -gt 90000 ]; then mode=catchup; fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Fetch mode: $mode"
      - name: Fetch all sources (daily run, manual dispatch, or an hourly run catching up)
        if: steps.mode.outputs.mode == 'full' || steps.mode.outputs.mode == 'catchup'
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          # Optional (a free OpenAlex key raises the daily allowance); empty when the secret is not set.
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          DECISION_ADMINS: ${{ secrets.DECISION_ADMINS }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          if npm run fetch; then
            date -u +%Y-%m-%dT%H:%M:%SZ > data/last_full_fetch.txt
          elif [ "$MODE" = "catchup" ]; then
            # The hourly run still has to publish the forms; the full fetch is tried again next hour.
            echo "::warning::Full fetch failed in a catch-up run; fetching the forms only."
            git checkout -- data
            node scripts/fetch-sources.mjs --only=manual,decisions
          else
            exit 1
          fi
      - name: Fetch the two Google Forms only (hourly run)
        if: steps.mode.outputs.mode == 'forms'
        env:
          DECISION_ADMINS: ${{ secrets.DECISION_ADMINS }}
        run: node scripts/fetch-sources.mjs --only=manual,decisions
      # Validate the fetched data before it is committed, so a bad fetch is not pushed.
      - name: Build JSON from data/
        run: npm run data
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openalex.tsv data/tci_articles.tsv data/scopus.tsv data/manual.tsv data/self.tsv data/scholar_imports.tsv data/form_cancels.tsv data/crossref.tsv data/tci_journals.csv data/tci_snapshots data/tci_tier_history.csv data/scopus_journals.csv data/scopus_quartiles.csv data/conferences.csv data/last_full_fetch.txt
          if [ -d data/status ]; then git add data/status; fi
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily data refresh $(date -u +%Y-%m-%d)"
            # The iMac job or a manual push may have landed since checkout.
            git pull --rebase origin main
            git push
          fi
      - name: Build JSON again (the pull above may have brought newer data)
        if: github.event_name != 'push'
        run: npm run data
      - name: Unit tests (rules engine and classifier)
        run: npm test
      - name: Build site (and the personal pages when PERSONAL_SALT is set)
        env:
          PERSONAL_SALT: ${{ secrets.PERSONAL_SALT }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # A second copy of the site on Cloudflare Pages (https://seen-education-service.pages.dev), served at
      # the root, so it is built again with SITE_BASE=/. Skipped until the two CLOUDFLARE_* secrets are set.
      # wrangler runs outside the repository so it does not try to set the project up as a Worker.
      # continue-on-error: a failed Cloudflare build or upload shows as a warning and must not stop
      # the GitHub Pages deploy below.
      - name: Build for Cloudflare Pages (root path)
        id: cfbuild
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        continue-on-error: true
        env:
          SITE_BASE: /
          PERSONAL_SALT: ${{ secrets.PERSONAL_SALT }}
        run: npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.cfbuild.outcome == 'success'
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP"
          npx -y wrangler@4.160.1 pages deploy "$GITHUB_WORKSPACE/dist" --project-name seen-education-service --branch main --commit-dirty=true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
