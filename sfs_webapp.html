<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)" />
    <title>ระบบตรวจสอบคุณสมบัติอาจารย์ SEEN</title>
    <link rel="icon" type="image/png" href="/src/assets/seen-favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Academic theme (after sbryngelson/academic-website-template): Source Serif 4 + DM Sans + JetBrains Mono
         for Latin; Noto Serif Thai / Noto Sans Thai carry the Thai glyphs. -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the saved light/dark choice before first paint (src/ThemeToggle.tsx). -->
    <script>
      try { var t = localStorage.getItem('seen-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/webapp/main.tsx"></script>
  </body>
</html>
